name: Retrain and Deploy Iris Model

on:
  push:
    paths:
      - 'data/Iris.csv'
      - 'src/models.py'
      - 'src/main.py'

jobs:
  retrain_and_build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train iris models
        run: |
          python src/main.py

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner | toLower }}/iris-api:latest .

      - name: Push Docker image
        run: |
          docker push ghcr.io/${{ github.repository_owner | toLower }}/iris-api:latest
