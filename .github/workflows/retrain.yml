name: Retrain and Deploy Iris Model

on:
  push:
    paths:
      - 'data/Iris.csv'
      - 'src/models.py'
      - 'src/main.py'
      - 'src/app.py'

jobs:
  retrain_and_build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # Setup Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # Install dependencies
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # Retrain model
      - name: Train iris models
        run: |
          python src/main.py

      # Login to GitHub Container Registry (GHCR)
      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build Docker image
      - name: Build Docker image
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "Using GHCR Owner: $OWNER"
          docker build -t ghcr.io/$OWNER/iris-api:latest .

      # Push Docker image
      - name: Push Docker image
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "Pushing to GHCR Owner: $OWNER"
          docker push ghcr.io/$OWNER/iris-api:latest
